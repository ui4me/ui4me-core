name: Host verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libdbus-1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain && rustup component add rustfmt clippy
      - name: Verify shared contracts and backend protocol
        run: python tools/verify.py --keep-going
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: verification/
          if-no-files-found: warn
