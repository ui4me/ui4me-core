[app]
id = "org.ui4me.PowerShellQualification"
name = "UI4ME PowerShell qualification (ps51)"
version = "1.0.1"

[backend]
program = "powershell.exe"
args = ["-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "{app_dir}/Qualify.ps1"]
cwd = "{app_dir}"

[host]
startup_timeout_ms = 60000
shutdown_timeout_ms = 10000
max_windows = 8
instance = "multiple"
