<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>UI4ME PowerShell qualification</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="titlebar" id="titlebar" data-ui4me-drag><span id="caption">PS qualification · ünïcødé</span>
  <nav data-ui4me-no-drag><button id="minimize" aria-label="Minimize">_</button><button id="maximize" aria-label="Maximize">[]</button><button id="close" aria-label="Close">X</button></nav></div>
<main id="root">
  <h1 id="heading">Qualification</h1>
  <p id="status" aria-live="polite">Starting</p>
  <div class="row"><button id="target">Target</button><button id="other">Other</button></div>
  <form id="form" class="row">
    <input id="name" name="name" type="text" value="initial" autocomplete="off">
    <input id="agree" name="agree" type="checkbox">
    <select id="choice" name="choice"><option value="a">Alpha</option><option value="b">Beta</option><option value="c">Gamma</option></select>
    <button id="submit" type="submit">Submit</button>
  </form>
  <ul id="list"><li>one</li><li class="two">two</li><li>three</li></ul>
  <img id="logo" src="ui4me-res://generated/dot.png" width="8" height="8" alt="Generated dot">
  <img id="bitmap" src="ui4me-bitmap://frames" width="320" height="200" alt="Live bitmap">
</main>
<div class="edge n" data-ui4me-resize="n"></div><div class="edge s" data-ui4me-resize="s"></div>
<div class="edge e" data-ui4me-resize="e"></div><div class="edge w" data-ui4me-resize="w"></div>
<div class="corner ne" data-ui4me-resize="ne"></div><div class="corner nw" data-ui4me-resize="nw"></div>
<div class="corner se" data-ui4me-resize="se"></div><div class="corner sw" data-ui4me-resize="sw"></div>
</body></html>
