[app]
id = "org.ui4me.PowerShellFrameless"
name = "PowerShell Frameless Window"
version = "1.0.1"

[backend]
program = "pwsh"
args = ["-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "{app_dir}/app.ps1"]
cwd = "{app_dir}"

[host]
startup_timeout_ms = 15000
shutdown_timeout_ms = 5000
max_windows = 8
instance = "single"
