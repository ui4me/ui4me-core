<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
* { box-sizing:border-box; } html,body { margin:0; width:640px; height:420px; overflow:hidden; background:#f0f3f5; }
.flex { display:flex; justify-content:space-between; align-items:center; width:592px; height:130px; margin:24px; padding:16px; background:#dce7ec; }
.flex div { width:90px; height:60px; background:#356f86; } .flex div:nth-child(2) { height:90px; background:#78b5ad; }
.grid { display:grid; grid-template-columns:120px 1fr 160px; grid-template-rows:70px 70px; gap:12px; width:592px; margin:24px; padding:12px; background:#dce7ec; }
.grid div { background:#356f86; } .grid div:nth-child(2n) { background:#78b5ad; }
</style><title>Flex and grid fixture</title></head><body><div class="flex"><div></div><div></div><div></div></div><div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div></div></body></html>
