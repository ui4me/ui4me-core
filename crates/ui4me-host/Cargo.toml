[package]
name = "ui4me-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Renderer-independent desktop application host for UI4ME"
publish = false
build = "build.rs"

[lib]
name = "ui4me_host"

[[bin]]
name = "ui4me-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
winit = { version = "=0.31.0-beta.4", default-features = false, features = ["wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
raw-window-handle = "0.6"
accesskit = "=0.25.2"
fontdue = "0.9"
png = "0.18"
unicode-segmentation = "1"
futures-lite = "2"
url = "2"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "=0.2.5"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "raw_handle", "wayland"] }
async-io = "2"
accesskit_unix = { version = "=0.24.1", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
accesskit_windows = "=0.35.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Environment", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

