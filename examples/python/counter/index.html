<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Python Counter</title>
<link rel="stylesheet" href="style.css"></head><body>
<main><p class="eyebrow">UI4ME CORE · PYTHON</p>
<h1>Native HTML/CSS without a browser</h1>
