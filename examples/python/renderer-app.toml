[app]
id = "org.ui4me.RendererReference"
name = "UI4ME Desktop Workspace"
version = "0.2.0"
icon = "{app_dir}/../../crates/ui4me-host/assets/ui4me.png"

[backend]
# tools/run_renderer.py selects the active interpreter automatically.
program = "python3"
args = ["{app_dir}/renderer_demo.py"]
cwd = "{app_dir}"

[host]
startup_timeout_ms = 30000
shutdown_timeout_ms = 5000
max_windows = 16
instance = "single"
