[package]
name = "render-audit-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ui4me-renderer = { path = "<repo>/crates/ui4me-renderer" }

[workspace]

[profile.dev]
opt-level = 2
debug = 0
[profile.dev.package."*"]
opt-level = 2
debug = 0
[profile.dev.build-override]
opt-level = 0
[profile.dev.package.ui4me-renderer]
opt-level = 3
codegen-units = 1
